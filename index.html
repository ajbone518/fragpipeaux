<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FragPipe Aux — proteomics analysis</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='10' cy='21' r='3' fill='white'/%3E%3Ccircle cx='16' cy='11' r='3' fill='white'/%3E%3Ccircle cx='22' cy='18' r='3' fill='white'/%3E%3C/svg%3E" />
    <!-- Styles for the boot screen only; they must work even if the app's CSS never loads. -->
    <style>
      .boot { font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #52514e; max-width: 560px; margin: 18vh auto 0; padding: 0 16px; }
      .boot h1 { font-size: 18px; color: #121211; margin: 0 0 8px; }
      .boot code { font: 13px ui-monospace, Menlo, monospace; background: #f0efec; padding: 1px 5px; border-radius: 4px; }
      @media (prefers-color-scheme: dark) {
        html { background: #121211; }
        .boot { color: #c3c2b7; }
        .boot h1 { color: #f0efec; }
        .boot code { background: #2a2a28; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" data-boot><p>Loading FragPipe Aux…</p></div></div>
    <noscript><div class="boot"><h1>JavaScript is required</h1><p>FragPipe Aux runs entirely in your browser. Enable JavaScript and reload.</p></div></noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Never fail silently with a blank page: explain what went wrong instead.
      (function () {
        function show(title, html) {
          var el = document.querySelector("[data-boot]");
          if (el) el.innerHTML = "<h1>" + title + "</h1>" + html;
        }
        // GitHub Pages "Deploy from a branch" serves this unbuilt file, whose
        // entry point is TypeScript that browsers cannot run.
        if (document.querySelector('script[src$=".tsx"]') && !/^(localhost|127\.)/.test(location.hostname)) {
          show("This is the unbuilt source, not the app",
            "<p>The server is publishing the repository files directly instead of the build output.</p>" +
            "<p>On GitHub, open <b>Settings → Pages</b>, set <b>Source</b> to <b>GitHub Actions</b>, then re-run the <i>Deploy to GitHub Pages</i> workflow.</p>");
          return;
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && t.tagName === "SCRIPT") {
            show("The app failed to load", "<p>Could not download <code>" + (t.getAttribute("src") || "script") + "</code>. Check your connection and reload; if it persists, the deployment may be incomplete.</p>");
          } else if (document.querySelector("[data-boot]")) {
            show("The app failed to start", "<p>" + String(e.message || "Unknown error") + "</p><p>This usually means the browser is too old. Try a current version of Chrome, Firefox, Safari or Edge.</p>");
          }
        }, true);
        setTimeout(function () {
          if (document.querySelector("[data-boot]"))
            show("Still loading…", "<p>This is taking longer than expected. Reload the page; if it stays here, open the browser console for details.</p>");
        }, 15000);
      })();
    </script>
  </body>
</html>
